name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ZenTials.zip has NO top folder, so it unpacks straight into the repo root
      - name: Unzip source
        run: unzip -oq ZenTials.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Gradle build
        run: gradle build --no-daemon

      - name: Publish jar to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ZenTials latest
          files: build/libs/*.jar